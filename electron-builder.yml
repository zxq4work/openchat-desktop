appId: com.openchat.desktop
productName: OpenChat
copyright: Copyright 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - resources/**/*
  - package.json

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"

mac:
  icon: icon.icns
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-mac.${ext}
  category: public.app-category.productivity

linux:
  icon: icons
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Utility

win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

asar: true
name: Build

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run package:win

      - name: Package Portable
        run: npm run package:win:portable

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenChat-Windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            script: package:mac:x64
            runner: macos-15-intel
          - name: arm64
            script: package:mac:arm64
            runner: macos-15
          - name: universal
            script: package:mac:universal
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenChat-macOS-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run package:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenChat-Linux-x64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error